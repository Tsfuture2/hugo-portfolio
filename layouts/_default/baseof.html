<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ site.Params.description }}">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; color: #1a1a1a; line-height: 1.7; }
  header, main, footer { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  header { display: flex; justify-content: space-between; align-items: center; padding-top: 20px; padding-bottom: 20px; border-bottom: 1px solid #e5e5e5; }
  header .brand { font-weight: 700; text-decoration: none; color: inherit; }
  nav a { margin-left: 16px; text-decoration: none; color: #555; }
  nav a:hover { color: #000; }
  main { padding-top: 32px; padding-bottom: 48px; }
  h1 { font-size: 2rem; margin: 0 0 16px; }
  .card { border: 1px solid #e5e5e5; border-radius: 10px; padding: 16px 20px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 6px; font-size: 1.15rem; }
  .card p { margin: 0; color: #555; }
  .card a { text-decoration: none; color: inherit; }
  footer { color: #888; font-size: .85rem; padding-top: 20px; padding-bottom: 28px; border-top: 1px solid #e5e5e5; }
</style>
</head>
<body>
<header>
  <a class="brand" href="{{ "/" | relURL }}">{{ site.Title }}</a>
  <nav>{{ range site.Menus.main }}<a href="{{ .URL | relURL }}">{{ .Name }}</a>{{ end }}</nav>
</header>
<main>{{ block "main" . }}{{ end }}</main>
<footer>Built with Hugo · <a href="{{ site.Params.github }}">GitHub</a></footer>
</body>
</html>
